---
- name: Configure Yandex Cloud VM (Ubuntu 24.04)
  hosts: webservers
  become: true
  vars:
    docker_edition: 'ce'
    docker_users:
      - "{{ ansible_user }}"
    ufw_allowed_ports:
      - "22/tcp"
      - "80/tcp"
      - "443/tcp"

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - role: geerlingguy.docker

  tasks:
    - name: Set default deny incoming
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Allow required ports in UFW
      community.general.ufw:
        rule: allow
        port: "{{ item.split('/')[0] }}"
        proto: "{{ item.split('/')[1] }}"
      loop: "{{ ufw_allowed_ports }}"

    - name: Enable UFW firewall
      community.general.ufw:
        state: enabled
        logging: "on"

- name: Deploy project-devops-deploy application
  hosts: webservers
  become: true
  roles:
    - role: deploy