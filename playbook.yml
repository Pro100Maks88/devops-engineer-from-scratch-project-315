---
- name: Configure Yandex Cloud VM (Ubuntu 24.04)
  hosts: webservers
  become: true
  vars:
    docker_group: docker
    allowed_ports:
      - "22/tcp"
      - "80/tcp"
      - "443/tcp"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - software-properties-common
          - ca-certificates
          - gnupg
        state: present

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name: docker-ce
        state: present

    - name: Install Docker Compose Plugin
      ansible.builtin.apt:
        name: docker-compose-plugin
        state: present

    - name: Ensure Docker group exists
      ansible.builtin.group:
        name: "{{ docker_group }}"
        state: present

    - name: Add user to Docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: "{{ docker_group }}"
        append: true

    - name: Restart Docker service
      ansible.builtin.systemd:
        name: docker
        state: restarted
        daemon_reload: true

    - name: Allow required ports in UFW
      ansible.builtin.ufw:
        rule: allow
        port: "{{ item.split('/')[0] }}"
        proto: "{{ item.split('/')[1] }}"
      loop: "{{ allowed_ports }}"

    - name: Enable UFW firewall
      ansible.builtin.ufw:
        state: enabled

- name: Deploy project-devops-deploy application
  hosts: webservers
  become: true
  roles:
    - role: deploy
